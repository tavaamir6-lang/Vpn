name: Build APK

on:
  push:
    branches: [ main, new-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Download native Xray core
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 \
            https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.5.19/libv2ray.aar \
            -o app/libs/libv2ray.aar

      - name: Download hev tun2socks native libraries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a \
                   app/src/main/jniLibs/armeabi-v7a \
                   app/src/main/jniLibs/x86 \
                   app/src/main/jniLibs/x86_64
          curl -fL --retry 3 \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.17.1/hev-socks5-tunnel-android-arm64-v8a \
            -o app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          curl -fL --retry 3 \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.17.1/hev-socks5-tunnel-android-armeabi-v7a \
            -o app/src/main/jniLibs/armeabi-v7a/libhev-socks5-tunnel.so
          curl -fL --retry 3 \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.17.1/hev-socks5-tunnel-android-x86 \
            -o app/src/main/jniLibs/x86/libhev-socks5-tunnel.so
          curl -fL --retry 3 \
            https://github.com/heiher/hev-socks5-tunnel/releases/download/2.17.1/hev-socks5-tunnel-android-x86_64 \
            -o app/src/main/jniLibs/x86_64/libhev-socks5-tunnel.so
          chmod +x app/src/main/jniLibs/*/libhev-socks5-tunnel.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Light-Speed-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
